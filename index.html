
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DreamVid AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101020;color:white;font-family:Arial,sans-serif;padding:24px}
main{max-width:700px;margin:40px auto}
h1{font-size:36px;color:#c4b5fd}
p{color:#c7c7d8;line-height:1.6}
textarea,select,button{width:100%;padding:14px;margin:8px 0;border-radius:12px;font-size:16px}
textarea,select{background:#202038;color:white;border:1px solid #555}
button{background:#8b5cf6;color:white;border:0;font-weight:bold}
.card{background:#1b1b30;padding:20px;border-radius:18px;margin-top:20px}
#result{white-space:pre-wrap;line-height:1.7}
</style>
</head>
<body>
<main>
<h1>🎬 DreamVid AI</h1>
<p>สร้างไอเดียคลิป AI สำหรับ TikTok และรีวิวสินค้า</p>
<div class="card">
<label for="idea">อยากสร้างคลิปเกี่ยวกับอะไร?</label>
<textarea id="idea" rows="4" placeholder="เช่น คลิปรีวิวครีมให้น่าสนใจ"></textarea>
<label for="style">เลือกแนวคลิป</label>
<select id="style">
<option>รีวิวสินค้า</option>
<option>คลิปไวรัล TikTok</option>
<option>การ์ตูน AI</option>
<option>เล่าเรื่อง</option>
</select>
<button onclick="makePlan()">สร้างแผนคลิป</button>
<div id="result"></div>
</div>
</main>
<script>
function makePlan(){
const idea=document.getElementById('idea').value.trim();
const style=document.getElementById('style').value;
if(!idea){alert('กรุณาพิมพ์ไอเดียคลิปก่อน');return}
document.getElementById('result').textContent=
'✨ แผนคลิป DreamVid AI\n\n'+
'หัวข้อ: '+idea+'\nแนวคลิป: '+style+
'\n\nเปิดคลิป:\n'+ '“อย่าเพิ่งเลื่อนผ่าน! วันนี้เรามีเรื่องน่าสนใจมาบอก”'+
'\n\nฉากที่ 1: เปิดด้วยภาพที่ดึงดูดความสนใจ\n'+
'ฉากที่ 2: นำเสนอเนื้อหาหลักเกี่ยวกับ '+idea+
'\nฉากที่ 3: สรุปและชวนผู้ชมติดตาม\n\n'+
'พรอมต์สำหรับ AI วิดีโอ:\n'+
'Create a vertical 9:16 '+style+' video about '+idea+
', engaging visuals, smooth transitions, suitable for TikTok.';
}
</script>
</body>
</html>
